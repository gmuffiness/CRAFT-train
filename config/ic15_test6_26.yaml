      random_rotate:
        max_angle: 20
        option: False
      random_crop:
        version: "random_resize_crop"
        scale: [0.333, 1.0]
        ratio: [0.75, 1.333]
        option: True
      random_horizontal_flip:
        option: False
      random_colorjitter:
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.2
        option: True
    icdar_aug:
      random_scale:
        range: [ 1.0, 1.5, 2.0 ]
        option: False
      random_rotate:
        max_angle: 20
        option: False
      random_crop:
        version: "random_resize_crop"
        scale: [ 0.333, 1.0 ]
        ratio: [ 0.75, 1.333 ]
        option: True
      random_horizontal_flip:
        option: False
      random_colorjitter:
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.2
        option: True


