train:
  ckpt_path: "/nas/home/jihyokim/jm/CRAFT-Refactoring/config/shwang_test26_CRAFT_clr_amp_60000.pth"
  batch_size: 20
  st_iter: 0
  end_iter: 10
  lr: 0.0001
  lr_decay: 15000
  gamma: 0.2
  weight_decay: 0.00001
  num_workers: 4
  amp: True
  loss: 3
  neg_rto: 1
  n_min_neg: 1000
