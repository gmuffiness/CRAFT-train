    vis_opt: False
    pseudo_vis_opt: False
    output_size: 768
    enlarge_size: 0.5
    gauss_init_size: 200
    gauss_sigma: 40
    watershed_version: 3
    syn_aug:
      random_scale:
        range: [1.0, 1.5, 2.0]
